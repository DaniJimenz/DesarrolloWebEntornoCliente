<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalStorage</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <section id="formulario">
        <h1>TABLERO KANBAN</h1>
        
        <label id="label">Introduce el número de Columnas (Max 4)</label>
        <input type="number" id="columnas" min="1" max="4">
        <button id="botonA">Configurar Columnas</button>
        
        <div id="columnaCampos" class="oculto">
            <label for="nombre">Nombre de la Columna</label>
            <input type="text" id="nombre">

            <label for="limite">Límite de Tareas</label>
            <input type="number" id="limite" min="1">

            <button id="botonC">Guardar Columna</button>
        </div>

        <div class="accionesFormulario">
            <button id="botonB" class="oculto">Generar Tablero</button>
        </div>
    </section>
        
    <section id="tabla" class="oculto"></section>

    <section id="nuevaTarea" class="oculto">
        <h3>Añadir Tarea</h3>
        <input type="text" id="tarea" placeholder="descripcion">
        <p><small>Escribe aquí y luego pulsa "Añadir Tarea" en la columna correspondiente.</small></p>
    </section>

    <div class="botonReiniciar">
        <button id="limpiar">Reiniciar Tablero</button>
    </div>

    <script src="./main.js"></script>
</body>
</html>
